<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada Redes & Segurança — Modo Gamificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f4;
  --panel: #ffffff;
  --panel-2: #f2f5f6;
  --border: #dbe3e6;
  --text: #12202a;
  --text-dim: #5c6f78;
  --accent: #0ea394;
  --accent-soft: #d9f3ef;
  --accent-2: #d97a06;
  --accent-2-soft: #fdead0;
  --accent-3: #7c5cd6;
  --accent-3-soft: #ece5fb;
  --ok: #1f9d55;
  --ok-soft: #dff5e6;
  --err: #d5433c;
  --err-soft: #fbe2e0;
  --gold: #b8860b;
  --gold-soft: #faf1d6;
  --shadow: 0 1px 3px rgba(10,20,25,0.08), 0 6px 18px rgba(10,20,25,0.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1418;
    --panel: #141d23;
    --panel-2: #182229;
    --border: #26343c;
    --text: #eaf1f4;
    --text-dim: #90a3ac;
    --accent: #35d6c0;
    --accent-soft: #10302c;
    --accent-2: #ffb238;
    --accent-2-soft: #34270f;
    --accent-3: #a58bff;
    --accent-3-soft: #241d3d;
    --ok: #52d788;
    --ok-soft: #10301d;
    --err: #ff8a83;
    --err-soft: #391714;
    --gold: #f5c542;
    --gold-soft: #332a10;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Poppins", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
}
.fun { font-family: "Fredoka", "Poppins", sans-serif; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
button { font-family: inherit; }
::selection { background: var(--accent-soft); }

/* ---------- HUD HEADER ---------- */
header.top {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 30;
  flex-wrap: wrap;
}
#menuBtn {
  display: none;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand .mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(145deg, var(--accent), var(--accent-3));
  display: flex; align-items: center; justify-content: center; flex: 0 0 36px;
  box-shadow: var(--shadow);
}
.brand .mark svg { width: 20px; height: 20px; }
.brand strong { font-size: 14.5px; display: block; }
.brand span { font-size: 11.5px; color: var(--text-dim); }

.hud { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 220px; }
.level-chip {
  font-family: "Fredoka"; font-weight: 600; font-size: 12.5px;
  background: var(--accent-3-soft); color: var(--accent-3);
  border-radius: 999px; padding: 5px 12px; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.xp-wrap { flex: 1; min-width: 100px; }
.xp-bar { height: 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; }
.xp-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-3)); width: 0%; transition: width .5s cubic-bezier(.2,.9,.3,1); }
.xp-label { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; font-family: "Fredoka"; letter-spacing: .01em; }
.streak-chip {
  font-family: "Fredoka"; font-weight: 600; font-size: 12.5px;
  background: var(--accent-2-soft); color: var(--accent-2);
  border-radius: 999px; padding: 5px 12px; white-space: nowrap; display: flex; align-items: center; gap: 5px;
}
.icon-btn {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- LAYOUT ---------- */
.layout { flex: 1; display: flex; min-height: 0; }
nav#sidebar {
  width: 320px; flex: 0 0 320px; border-right: 1px solid var(--border);
  background: var(--panel); overflow-y: auto; padding: 14px 10px 40px;
}
.bim-group { margin-bottom: 10px; }
.bim-head {
  font-family: "Fredoka"; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-dim); padding: 6px 8px; display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.bim-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: 0 0 8px; }
.bim-head.done .dot { background: var(--ok); }
.bim-pts { margin-left: auto; font-family: "Fredoka"; font-size: 11px; color: var(--text-dim); background: var(--panel-2); padding: 2px 8px; border-radius: 10px; letter-spacing: 0; text-transform: none; }
.bim-score { font-weight: 600; color: var(--accent); font-size: 13px; margin: 0 0 12px; }
.mod { margin-bottom: 4px; border-radius: 10px; overflow: hidden; }
.mod-title {
  font-weight: 600; font-size: 13px; padding: 9px 10px; background: var(--panel-2); cursor: pointer;
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px;
}
.mod-node {
  width: 22px; height: 22px; border-radius: 50%; flex: 0 0 22px; display: flex; align-items: center; justify-content: center;
  font-family: "Fredoka"; font-size: 10.5px; font-weight: 600; border: 2px solid var(--border); color: var(--text-dim); background: var(--panel);
}
.mod-node.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.mod-node.current { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.mod-node.locked { background: var(--panel-2); border-color: var(--border); color: var(--text-dim); opacity: .55; }
.mod.locked .mod-title { cursor: not-allowed; opacity: .65; }
.mod-title .mt-title { flex: 1; }
.mod-title .mt-pct { font-size: 10.5px; color: var(--text-dim); font-family: "Fredoka"; }
.mod-deadline { font-size: 10.5px; padding: 3px 10px 6px 40px; color: var(--text-dim); font-family: "Fredoka"; }
.mod-deadline.overdue { color: var(--err); font-weight: 600; }
.mod-screens { list-style: none; margin: 4px 0 0; padding: 0; }
.mod-screens li {
  padding: 7px 10px 7px 40px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; border-radius: 8px;
  display: flex; align-items: center; gap: 8px;
}
.mod-screens li:hover { background: var(--panel-2); }
.mod-screens li.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mod-screens li .stype { width: 16px; flex: 0 0 16px; text-align: center; font-size: 11px; }
.mod-screens li .chk { color: var(--ok); }

main#content { flex: 1; overflow-y: auto; padding: 30px 34px 70px; max-width: 880px; margin: 0 auto; width: 100%; position: relative; }
@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  nav#sidebar { position: fixed; left: 0; top: 58px; bottom: 0; z-index: 40; transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow); }
  nav#sidebar.open { transform: translateX(0); }
  main#content { padding: 20px 16px 70px; }
  .hud { order: 3; flex-basis: 100%; }
}

/* ---------- SCREEN CHROME ---------- */
.screen-kicker { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; font-family: "Fredoka"; }
.screen-title { font-size: 23px; font-weight: 700; margin: 0 0 20px; }
.type-banner {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius);
  margin-bottom: 16px; font-family: "Fredoka"; font-weight: 600; font-size: 13.5px;
}
.type-banner .medal { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: 0 0 34px; }
.type-banner .medal svg { width: 19px; height: 19px; }
.type-banner .xp-tag { margin-left: auto; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.06); }

.tb-intro { background: var(--accent-2-soft); color: var(--accent-2); } .tb-intro .medal { background: var(--accent-2); color: #fff; }
.tb-concept { background: var(--accent-soft); color: var(--accent); } .tb-concept .medal { background: var(--accent); color: #fff; }
.tb-practice { background: var(--ok-soft); color: var(--ok); } .tb-practice .medal { background: var(--ok); color: #fff; }
.tb-quiz { background: var(--accent-3-soft); color: var(--accent-3); } .tb-quiz .medal { background: var(--accent-3); color: #fff; }
.tb-social { background: var(--err-soft); color: var(--err); } .tb-social .medal { background: var(--err); color: #fff; }
.tb-summary { background: var(--gold-soft); color: var(--gold); } .tb-summary .medal { background: var(--gold); color: #fff; }
.tb-activity { background: var(--ok-soft); color: var(--ok); } .tb-activity .medal { background: var(--ok); color: #fff; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h4 { margin: 0 0 10px; font-size: 15.5px; color: var(--text); font-family: "Fredoka"; font-weight: 600; }
.card p { margin: .6em 0; font-size: 14.5px; }
.card ul, .card ol { margin: .5em 0; padding-left: 22px; font-size: 14.5px; }
.card li { margin-bottom: 6px; }
.card table { border-collapse: collapse; width: 100%; margin: .6em 0; font-size: 13.5px; }
.card table td, .card table th { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.card table th { background: var(--panel-2); }
.skills-row { display: flex; gap: 10px; flex-wrap: wrap; margin: -4px 0 16px; }
.skill-pill { font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; color: var(--text-dim); }

/* ---------- QUIZ ---------- */
.quiz-score { font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-family: "Fredoka"; }
.quiz-q { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; background: var(--panel); box-shadow: var(--shadow); }
.quiz-q .qtext { font-weight: 600; margin-bottom: 12px; font-size: 14.5px; }
.quiz-opt {
  display: block; width: 100%; text-align: left; background: var(--panel-2); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 9px; cursor: pointer; font-size: 13.5px; color: var(--text); font-family: inherit;
  transition: transform .1s ease, border-color .15s ease;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.quiz-opt.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.quiz-opt.wrong { background: var(--err-soft); border-color: var(--err); color: var(--err); font-weight: 600; animation: shake .3s; }
.quiz-opt:disabled { cursor: default; }
.quiz-explain { display: none; font-size: 13px; color: var(--text-dim); margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border-left: 3px solid var(--accent); }
.quiz-explain.open { display: block; }
.xp-float { display: inline-block; font-family: "Fredoka"; font-weight: 700; color: var(--ok); font-size: 12.5px; margin-left: 8px; opacity: 0; animation: floatUp .9s ease forwards; }
@keyframes floatUp { 0%{opacity:0; transform:translateY(4px);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(-14px);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

/* ---------- ACTIVITY / GABARITO TOGGLE ---------- */
.gabarito-toggle { background: var(--panel-2); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-dim); font-family: "Fredoka"; margin-top: 10px; }
.gabarito-box { display: none; margin-top: 10px; }
.gabarito-box.open { display: block; }

/* ---------- SUMMARY / SAIBA MAIS ---------- */
.saiba-box { border-left: 3px solid var(--gold); background: var(--gold-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 13.5px; margin-top: 10px; }

/* ---------- FOOTER ---------- */
footer.bottomnav { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; bottom: 0; z-index: 20; }
footer.bottomnav .center-label { font-size: 12px; color: var(--text-dim); text-align: center; flex: 1; font-family: "Fredoka"; }
.btn { background: var(--accent); color: #06231f; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: "Fredoka"; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 45; }
.overlay.show { display: block; }

/* ---------- MODALS (badges / level-up) ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; }
.modal .backdrop { position: absolute; inset: 0; background: rgba(5,10,14,.6); }
.modal .sheet { position: relative; background: var(--panel); border-radius: 18px; padding: 28px; max-width: 480px; width: 100%; box-shadow: var(--shadow); max-height: 82vh; overflow-y: auto; }
.modal .sheet h2 { font-family: "Fredoka"; margin: 0 0 6px; font-size: 20px; }
.modal .close { position: absolute; top: 14px; right: 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: var(--text); }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
.badge-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; background: var(--panel-2); }
.badge-card.earned { background: var(--gold-soft); border-color: var(--gold); }
.badge-card .bicon { width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%; background: var(--panel); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
.badge-card.earned .bicon { border-color: var(--gold); background: var(--gold-soft); }
.badge-card .bicon svg { width: 22px; height: 22px; opacity: .35; }
.badge-card.earned .bicon svg { opacity: 1; }
.badge-card .bname { font-family: "Fredoka"; font-weight: 600; font-size: 12px; }
.badge-card .bdesc { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }

.levelup-sheet { text-align: center; }
.levelup-sheet .big { font-family: "Fredoka"; font-size: 40px; font-weight: 700; color: var(--gold); margin: 6px 0; }

/* ---------- CONFETTI ---------- */
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

/* ---------- MAP VIEW ---------- */
.mapwrap { display: flex; flex-direction: column; gap: 26px; }
.map-bim { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.map-bim h3 { font-family: "Fredoka"; margin: 0 0 4px; font-size: 16px; }
.map-bim p { margin: 0 0 14px; font-size: 12.5px; color: var(--text-dim); }
.map-trail { display: flex; flex-wrap: wrap; gap: 10px; }
.map-node {
  width: 78px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 6px; border-radius: 12px;
}
.map-node:hover { background: var(--panel-2); }
.map-node .circ {
  width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: "Fredoka"; font-weight: 700; font-size: 15px; border: 2.5px solid var(--border); color: var(--text-dim); background: var(--panel);
}
.map-node.done .circ { background: var(--ok); border-color: var(--ok); color: #fff; }
.map-node.current .circ { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 5px var(--accent-soft); }
.map-node.locked { cursor: not-allowed; }
.map-node.locked .circ { background: var(--panel-2); border-color: var(--border); color: var(--text-dim); opacity: .55; }
.map-node .lbl { font-size: 10.5px; text-align: center; color: var(--text-dim); line-height: 1.25; }
.map-node .lbl .dl { display: block; font-family: "Fredoka"; margin-top: 2px; }
.map-node .lbl .dl.overdue { color: var(--err); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" aria-label="Abrir menu">☰</button>
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg></div>
      <div>
        <strong>Jornada Redes &amp; Segurança</strong>
        <span>Trilha gamificada · Redes de Computadores e Segurança da Informação na Nuvem</span>
      </div>
    </div>
    <div class="hud">
      <div class="level-chip" id="levelChip">Nível 1 · Estagiário(a)</div>
      <div class="xp-wrap">
        <div class="xp-bar"><div id="xpFill"></div></div>
        <div class="xp-label" id="xpLabel">0 XP</div>
      </div>
      <div class="streak-chip" id="streakChip">0</div>
    </div>
    <button class="icon-btn" id="mapBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-6 2V6l6-2m0 16l6-2m-6 2V4m6 14l6 2V4l-6-2m0 16V2"/></svg>
      Mapa
    </button>
    <button class="icon-btn" id="badgesBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/></svg>
      Conquistas
    </button>
    <a class="icon-btn" href="ferramentas.html" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.6.8 1 1.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Ferramentas
    </a>
    <a class="icon-btn" href="https://olisam2303-ux.github.io/apostila-projeto-software-interativa/" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Projetando Software
    </a>
  </header>
  <div class="layout">
    <div class="overlay" id="overlay"></div>
    <nav id="sidebar"></nav>
    <main id="content"></main>
  </div>
  <footer class="bottomnav">
    <button class="btn secondary" id="prevBtn">← Anterior</button>
    <span class="center-label" id="footerLabel"></span>
    <button class="btn" id="nextBtn">Próximo →</button>
  </footer>
</div>

<div class="modal" id="badgesModal">
  <div class="backdrop"></div>
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h2>Conquistas</h2>
    <p style="color:var(--text-dim); font-size:13px; margin:0;">Continue avançando na trilha para desbloquear todas.</p>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>
</div>

<div class="modal" id="levelupModal">
  <div class="backdrop"></div>

};

function buildScreensForAula(aula, aulaIdx) {
  const screens = [];
  const n = aulaIdx + 1;
  const push = (type, extra) => screens.push(Object.assign({ id: aula.code+'-'+type, title: 'Aula '+n+' — '+SCREEN_META[type].label, type, aulaTitle: aula.title, aulaCode: aula.code }, extra));

  if (aula.pontoDePartida) push('intro', { data: aula.pontoDePartida });
  if (aula.conceito && aula.conceito.length) push('concept', { data: { blocks: aula.conceito, skills: { tecnica: aula.habilidadeTecnica, socio: aula.habilidadeSocioemocional }, duracao: aula.duracao } });
  if (aula.colocandoEmPratica) push('practice', { data: aula.colocandoEmPratica });
  if (aula.quiz && aula.quiz.length) push('quiz', { data: { questions: aula.quiz } });
  if (aula.serSempreMais) push('social', { data: aula.serSempreMais });
  const refs = REFERENCIAS_POR_AULA[aula.code] || [];
  if ((aula.sintese && aula.sintese.length) || refs.length) push('summary', { data: { bullets: aula.sintese || [], saibaMais: aula.saibaMais, referencias: refs } });
  if (aula.atividadePratica) push('activity', { data: aula.atividadePratica });
  return screens;
}

function buildModule(week) {
  const screens = [];
  week.aulas.forEach((aula, i) => { screens.push(...buildScreensForAula(aula, i)); });
  return { id: week.id, title: week.title, unidade: week.unidade, bimestre: bimestreOfWeek(week.id), screens };
}

  let totalItems = 0, doneItems = 0;
  weeks.forEach(wid => {
    const mi = MODULES.findIndex(m=>m.id===wid);
    if (mi<0) return;
    const mod = MODULES[mi];
    mod.screens.forEach((scr, si) => {
      if (scr.type === 'quiz') {
        totalItems += scr.data.questions.length;
        const answered = state.quizAnswers[mod.id+'_'+scr.id] || {};
        doneItems += Object.values(answered).filter(a=>a && a.correct).length;
      } else if (scr.type === 'practice' || scr.type === 'activity') {
        totalItems += 1;
        if (state.visited[mi+'-'+si]) doneItems += 1;
      }
    });
  });
  const pts = totalItems ? Math.round((doneItems/totalItems)*10*10)/10 : 0;
  return { pts, doneItems, totalItems };
}
function addBusinessDays(date, days) {
  const d = new Date(date);
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) added++;
  }
  return d;
}
function fmtDate(d) { return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function ensureUnlockDates() {
  let changed = false;
  const newlyUnlocked = [];
  for (let mi = 0; mi < MODULES.length; mi++) {
    if (isModuleUnlocked(mi) && !state.unlockDates[mi]) {
      state.unlockDates[mi] = Date.now();
      newlyUnlocked.push(mi);
      changed = true;
    }
  }
  if (changed) saveState();
  return newlyUnlocked;
}
function weekDeadline(mi) {
  const ts = state.unlockDates[mi];
  if (!ts) return null;
  return addBusinessDays(new Date(ts), 5);
}
function bimestreDone(b, s) {
  const weeks = BIMESTRE_INFO[b].weeks;
  return weeks.every(wid => isModuleFullyVisited(wid, s));
}
function checkBadges() {
  let newly = [];
  BADGES.forEach(b => {
    const already = !!state.badges[b.id];
    if (!already && b.check(state)) { state.badges[b.id] = true; newly.push(b); }
  });
  if (newly.length) { saveState(); newly.forEach(b => toast('Conquista desbloqueada: '+b.name)); renderBadgesGrid(); }
}

function addXP(amount) {
  if (!amount) return;
  const before = levelOf(state.xp);
  state.xp += amount;
  const after = levelOf(state.xp);
  saveState();
  updateHUD();
  if (after > before) showLevelUp(after);
  checkBadges();
}

function renderQuiz(body, mod, screen) {
  const d = screen.data;
  const scoreLbl = el('div','quiz-score','');
  body.appendChild(scoreLbl);
  const answered = state.quizAnswers[mod.id+'_'+screen.id] || {};
  function updateScore() {
    let total = d.questions.length, correct = 0;
    Object.values(answered).forEach(a => { if (a && a.correct) correct++; });
    scoreLbl.textContent = 'Pontuação: '+correct+' / '+total;
  }
  d.questions.forEach((q, qi) => {
    const box = el('div','quiz-q');
    box.appendChild(el('div','qtext', (qi+1)+'. '+esc(q.question)));
    const explain = el('div','quiz-explain', q.feedback ? esc(q.feedback) : '');
    const optButtons = [];
    let attempts = 0;
    q.options.forEach((opt, oi) => {
      const b = el('button','quiz-opt', esc(opt));
      b.addEventListener('click', () => {
        if (answered[qi] && answered[qi].correct) return;
        attempts++;
        if (oi === q.correct) {
          answered[qi] = { correct:true, firstTry: attempts===1 };
          state.quizAnswers[mod.id+'_'+screen.id] = answered;
          saveState();
          optButtons.forEach((bb,ii)=>{ bb.disabled=true; if (ii===oi) bb.classList.add('correct'); });
          explain.classList.add('open');
          const gained = attempts===1 ? 20 : 10;
          const tag = el('span','xp-float','+'+gained+' XP');
          box.querySelector('.qtext').appendChild(tag);
          state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak);
          fireConfetti();
          addXP(gained);
          updateScore();
        } else {
          b.classList.add('wrong');
          b.disabled = true;
          state.streak = 0;
          saveState();
          updateHUD();
        }
      });
      box.appendChild(b);
      optButtons.push(b);
    });
    box.appendChild(explain);
    if (answered[qi] && answered[qi].correct) {
      optButtons.forEach((bb,ii)=>{ bb.disabled=true; if (ii===q.correct) bb.classList.add('correct'); });
      explain.classList.add('open');
    }
    body.appendChild(box);
  });
  updateScore();
}

  if (!isModuleUnlocked(mi)) { toast('Termine a semana anterior para desbloquear esta.'); return; }
  const key = mi+'-'+si;
  const alreadyVisited = !!state.visited[key];
  state.moduleIndex = mi; state.screenIndex = si; state.view = 'lesson';
  state.visited[key] = true;
  const scr = MODULES[mi].screens[si];
  justEarnedXP = 0;
  if (!alreadyVisited && scr.type !== 'quiz') {
    const xp = SCREEN_META[scr.type] ? SCREEN_META[scr.type].xp : 0;
    if (xp) justEarnedXP = xp;
  }
  saveState();
  render();
  if (justEarnedXP) addXP(justEarnedXP);
  document.getElementById('content').scrollTop = 0;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');

  const newlyUnlocked = ensureUnlockDates();
  if (appBooted) {
    newlyUnlocked.forEach(mi => {
      const dl = weekDeadline(mi);
      const label = MODULES[mi].title.replace(/^Semana \d+ — /,'');

const confettiCanvas = document.getElementById('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
function resizeCanvas(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
resizeCanvas(); addEventListener('resize', resizeCanvas);
let confettiParticles = [];
function fireConfetti(big) {
  if (confettiCanvas.width !== innerWidth || confettiCanvas.height !== innerHeight) resizeCanvas();
  const colors = ['#33D6C0','#FFB238','#9C7CF4','#52D788','#F5C542'];
  const count = big ? 140 : 60;
  for (let i=0;i<count;i++) {
    confettiParticles.push({
      x: innerWidth/2 + (Math.random()-0.5)*(big?innerWidth*0.6:200),
      y: big ? innerHeight*0.3 : (innerHeight*0.35),
      vx: (Math.random()-0.5)*8,
      vy: Math.random()*-6-2,
      g: 0.28,
      size: Math.random()*6+4,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*12,
      life: 90+Math.random()*30
    });
  }
  if (!confettiRAF) confettiLoop();
}
let confettiRAF = null;
function confettiLoop() {
  ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParticles.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life/40));
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life>0 && p.y < confettiCanvas.height+40);
  if (confettiParticles.length) { confettiRAF = requestAnimationFrame(confettiLoop); }
  else { confettiRAF = null; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

document.getElementById('mapBtn').addEventListener('click', () => { state.view='map'; saveState(); render(); });

document.getElementById('prevBtn').addEventListener('click', () => {
  if (state.view==='map') return;
  let mi = state.moduleIndex, si = state.screenIndex;
  if (si > 0) si--;
  else if (mi > 0) { mi--; si = MODULES[mi].screens.length-1; }
  goTo(mi, si);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (state.view==='map') return;
  let mi = state.moduleIndex, si = state.screenIndex;
  const mod = MODULES[mi];
  if (si < mod.screens.length-1) si++;
  else if (mi < MODULES.length-1) { mi++; si = 0; }
  goTo(mi, si);
});
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});

/* boot */
if (MODULES.length) {
  if (state.moduleIndex >= MODULES.length || state.moduleIndex < 0) state.moduleIndex = 0;
  const bootMod = MODULES[state.moduleIndex];
  if (state.screenIndex >= bootMod.screens.length || state.screenIndex < 0) state.screenIndex = 0;
  goTo(state.moduleIndex, state.screenIndex);
} else {
  document.getElementById('content').innerHTML = '<p style="padding:20px">Nenhum módulo carregado ainda.</p>';
}
</script>
</body>
</html>
